[package]
name = "openquota"
version = "0.5.0"
description = "Cross-platform AI quota tracker"
authors = ["OpenQuota contributors"]
edition = "2021"

[lib]
name = "openquota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Native desktop application (Tauri). Enabled by default so the upstream build
# is unchanged.
[[bin]]
name = "openquota"
path = "src/main.rs"
required-features = ["desktop"]

# Headless web server that reuses the provider logic and serves the Svelte UI.
[[bin]]
name = "openquota-server"
path = "src/bin/openquota-server.rs"
required-features = ["web"]

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-positioner",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-single-instance",
    "dep:notify-rust",
    "dep:tiny-skia",
    "dep:svgtypes",
    "dep:security-framework",
    "dep:fontdue",
    "dep:webview2-com",
    "dep:windows",
    "dep:windows-sys",
]
web = ["dep:axum", "dep:tower-http", "dep:futures"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
axum = { version = "0.8", optional = true }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
futures = { version = "0.3", optional = true }
notify-rust = { version = "4.18.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
svgtypes = { version = "0.16", optional = true }
# Uses Tauri's raw WebView2 handle; verify the Windows WebView2 dependencies when upgrading Tauri.
tauri = { version = "~2.11.5", features = ["image-png", "tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2.5.1", optional = true }
tauri-plugin-global-shortcut = { version = "2.3.2", optional = true }
tauri-plugin-notification = { version = "2.3.3", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tempfile = "3"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["simd", "std"], optional = true }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
walkdir = "2"
zeroize = "1.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fontdue = { version = "0.9.3", default-features = false, features = ["std"], optional = true }
security-framework = { version = "3.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = "5.13"

[dev-dependencies]
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
